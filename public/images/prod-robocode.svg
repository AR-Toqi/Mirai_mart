<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="roboGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECEFF1"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="16" fill="#F4F8FA"/>
  <g transform="translate(75, 45)">
    <!-- Base Shadow -->
    <ellipse cx="75" cy="210" rx="65" ry="16" fill="#CFD8DC" opacity="0.6"/>
    <!-- Body -->
    <rect x="25" y="90" width="100" height="95" rx="35" fill="url(#roboGrad)" stroke="#CFD8DC" stroke-width="2"/>
    <circle cx="75" cy="135" r="22" fill="#0A98C3"/>
    <circle cx="75" cy="135" r="10" fill="#BEE9FF"/>
    <!-- Head -->
    <rect x="20" y="15" width="110" height="70" rx="26" fill="url(#roboGrad)" stroke="#CFD8DC" stroke-width="2"/>
    <!-- Screen Face -->
    <rect x="30" y="24" width="90" height="52" rx="16" fill="#191C1E"/>
    <!-- Glowing Cyan Eyes & Smile -->
    <ellipse cx="55" cy="48" rx="10" ry="7" fill="#71D7F6"/>
    <ellipse cx="95" cy="48" rx="10" ry="7" fill="#71D7F6"/>
    <path d="M68 62 Q75 68 82 62" stroke="#71D7F6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Antenna -->
    <circle cx="75" cy="7" r="6" fill="#FCE35F"/>
    <line x1="75" y1="13" x2="75" y2="17" stroke="#78909C" stroke-width="3"/>
  </g>
</svg>
