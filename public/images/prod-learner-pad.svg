<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#F8FAFB"/>
  <!-- Interactive Learner Tablet Pad with bumper case -->
  <g transform="translate(45, 55)">
    <!-- Cyan protective bumper casing -->
    <rect x="10" y="15" width="190" height="150" rx="24" fill="#0A98C3" stroke="#007EA3" stroke-width="3"/>
    <!-- Screen frame -->
    <rect x="25" y="28" width="160" height="124" rx="10" fill="#191C1E"/>
    <!-- Screen canvas -->
    <rect x="30" y="33" width="150" height="114" rx="8" fill="#FFFDE7"/>
    <!-- Educational Game UI Icons on screen -->
    <rect x="42" y="45" width="28" height="28" rx="6" fill="#FF8A80"/>
    <text x="56" y="64" fill="#FFF" font-size="14" font-family="sans-serif" font-weight="bold" text-anchor="middle">A</text>
    <rect x="80" y="45" width="28" height="28" rx="6" fill="#81C784"/>
    <text x="94" y="64" fill="#FFF" font-size="14" font-family="sans-serif" font-weight="bold" text-anchor="middle">1</text>
    <rect x="118" y="45" width="28" height="28" rx="6" fill="#64B5F6"/>
    <circle cx="132" cy="59" r="8" fill="#FFF"/>
    <!-- Draw line -->
    <path d="M45 105 Q70 85 95 110 T145 95" stroke="#AB47BC" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
