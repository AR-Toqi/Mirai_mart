<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <defs>
    <linearGradient id="scooterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </linearGradient>
  </defs>

  <!-- Play ball -->
  <g transform="translate(60, 130)">
    <circle cx="35" cy="35" r="35" fill="#E1F5FE"/>
    <path d="M10 20 Q35 35 60 20 Q45 60 10 50 Z" fill="#0A98C3"/>
    <circle cx="35" cy="35" r="34" fill="none" stroke="#BEE9FF" stroke-width="2"/>
  </g>

  <!-- Teddy Bear -->
  <g transform="translate(120, 40)">
    <!-- Ears -->
    <circle cx="35" cy="30" r="16" fill="#D7CCC8"/>
    <circle cx="35" cy="30" r="9" fill="#FFCCBC"/>
    <circle cx="95" cy="30" r="16" fill="#D7CCC8"/>
    <circle cx="95" cy="30" r="9" fill="#FFCCBC"/>
    <!-- Head -->
    <circle cx="65" cy="65" r="38" fill="#D7CCC8"/>
    <circle cx="53" cy="60" r="4" fill="#3E2723"/>
    <circle cx="77" cy="60" r="4" fill="#3E2723"/>
    <ellipse cx="65" cy="74" rx="14" ry="10" fill="#EFEBE9"/>
    <polygon points="65,72 61,68 69,68" fill="#3E2723"/>
    <!-- Body -->
    <ellipse cx="65" cy="130" rx="36" ry="42" fill="#D7CCC8"/>
    <ellipse cx="65" cy="130" rx="22" ry="28" fill="#EFEBE9"/>
  </g>

  <!-- Scooter -->
  <g transform="translate(240, 30)">
    <!-- Handle bar -->
    <rect x="150" y="10" width="8" height="130" rx="4" fill="#263238" transform="rotate(-15 150 10)"/>
    <rect x="80" y="8" width="80" height="12" rx="6" fill="#FCE35F"/>
    <!-- Deck -->
    <rect x="70" y="150" width="130" height="20" rx="10" fill="url(#scooterGrad)" stroke="#F57F17" stroke-width="2"/>
    <!-- Front Wheels -->
    <circle cx="85" cy="170" r="22" fill="#263238"/>
    <circle cx="85" cy="170" r="12" fill="#FCE35F"/>
    <circle cx="120" cy="170" r="22" fill="#263238"/>
    <circle cx="120" cy="170" r="12" fill="#FCE35F"/>
    <!-- Rear Wheel -->
    <circle cx="190" cy="170" r="18" fill="#263238"/>
    <circle cx="190" cy="170" r="8" fill="#FCE35F"/>
  </g>
</svg>
