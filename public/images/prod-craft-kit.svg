<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#FFFDF8"/>
  <!-- Art & Craft Mega Kit -->
  <g transform="translate(45, 50)">
    <!-- Craft Box Container -->
    <rect x="20" y="100" width="170" height="90" rx="12" fill="#FFE082" stroke="#FFCA28" stroke-width="2"/>
    <!-- Brushes & Scissors sticking out -->
    <line x1="60" y1="40" x2="70" y2="100" stroke="#8D6E63" stroke-width="6" stroke-linecap="round"/>
    <polygon points="56,30 64,30 60,45" fill="#42A5F5"/>

    <line x1="85" y1="35" x2="85" y2="100" stroke="#8D6E63" stroke-width="6" stroke-linecap="round"/>
    <polygon points="81,25 89,25 85,40" fill="#EF5350"/>

    <line x1="110" y1="40" x2="100" y2="100" stroke="#8D6E63" stroke-width="6" stroke-linecap="round"/>
    <polygon points="106,30 114,30 110,45" fill="#66BB6A"/>

    <!-- Paint Tubes in Front -->
    <rect x="40" y="145" width="22" height="32" rx="4" fill="#E91E63"/>
    <rect x="75" y="145" width="22" height="32" rx="4" fill="#00BCD4"/>
    <rect x="110" y="145" width="22" height="32" rx="4" fill="#FFEB3B"/>
    <rect x="145" y="145" width="22" height="32" rx="4" fill="#4CAF50"/>
  </g>
</svg>
