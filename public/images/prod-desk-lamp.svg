<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF59D" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="16" fill="#F8FAFB"/>
  <!-- Nova Minimalist Desk Lamp -->
  <g transform="translate(60, 40)">
    <!-- Base -->
    <ellipse cx="90" cy="210" rx="45" ry="12" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="2"/>
    <!-- Stem -->
    <rect x="86" y="60" width="8" height="150" rx="4" fill="#B0BEC5"/>
    <!-- Lamp Head arm -->
    <rect x="86" y="55" width="80" height="10" rx="5" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="2"/>
    <!-- Light Beam -->
    <polygon points="90,65 160,65 190,195 60,195" fill="url(#lightBeam)"/>
  </g>
</svg>
